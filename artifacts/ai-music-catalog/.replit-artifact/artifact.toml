kind = "web"
previewPath = "/"
title = "AI Music Catalog"
description = "A simple mobile-first music catalog interface for organizing AI-generated music, starting with a focused welcome screen and entry points for importing music or browsing the library."
version = "1.0.0"
id = "artifacts/ai-music-catalog"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18379

[services.development]
run = "pnpm --filter @workspace/ai-music-catalog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-music-catalog", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-music-catalog/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18379"
BASE_PATH = "/"
